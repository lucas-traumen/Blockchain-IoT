server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 http://localhost:8001 http://127.0.0.1:8001 ws://localhost:3000 ws://127.0.0.1:3000" always;

    root /usr/share/nginx/html;
    index index.html;

    location @chain_api_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"code":"CHAIN_API_UNAVAILABLE","error":"Blockchain API is unreachable. Start or restart ./scripts/run_local_demo.sh and keep its terminal open."}';
    }

    location @iot_api_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"code":"IOT_API_UNAVAILABLE","error":"IoT API is unreachable. Start or restart ./scripts/run_local_demo.sh and keep its terminal open."}';
    }

    location = /api/iot {
        return 308 /api/iot/;
    }

    location = /api/chain {
        return 308 /api/chain/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep live telemetry same-origin so a LAN dashboard does not need the
    # operator to discover and maintain the Docker host IP in CORS settings.
    location /api/iot/ {
        proxy_pass http://iot_backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_intercept_errors on;
        error_page 502 504 = @iot_api_unavailable;
    }

    # The browser uses one origin for the dashboard and both APIs. This keeps
    # the blockchain API URL stable on localhost, WSL and LAN clients.
    location /api/chain/ {
        proxy_pass http://host.docker.internal:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_intercept_errors on;
        error_page 502 504 = @chain_api_unavailable;
    }
}
