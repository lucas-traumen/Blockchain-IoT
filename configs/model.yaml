# Cấu hình LSTM dùng chung cho train, evaluator và runtime.
# Top-level chứa identity và windowing; khối lstm giữ kiến trúc/preprocessing.

# ------------------------------------------------------------------ dùng chung
window_size: 10
delta_s: 0.1
horizons_ms: [100, 200, 300, 400, 500]
max_time_jitter_s: 0.03
max_gap_s: 0.25
stale_after_s: 0.5
random_seed: 42

# ------------------------------------------------------------------ identity
model_type: lstm
model_version: lstm-v1
preprocessing_version: pp-lstm-v1
training_data: synthetic-only
simulation_mode: true
threshold_verified_on_hardware: false

# ------------------------------------------------------------------ LSTM
lstm:
  model_type: lstm
  model_version: lstm-v1
  preprocessing_version: pp-lstm-v1
  # Window đích trùng khối dùng chung (khai lại để khối tự đóng gói;
  # contract test chặn hai nơi lệch nhau).
  window_size: 10
  delta_s: 0.1
  horizons_ms: [100, 200, 300, 400, 500]
  # Feature mỗi timestep: [khoảng cách (m), delta khoảng cách (m)];
  # delta của timestep đầu = 0 (quy ước preprocessing pp-lstm-v1).
  features: [distance_m, delta_distance_m]
  input_shape: [10, 2]
  output_shape: [5]
  # Kiến trúc (PLAN mục 4): LSTM 32 → Dropout 0.2 → Dense 32 ReLU → Dense 5.
  # Key đặt `lstm_units` (không phải `units`) để không ambiguity với
  # `units: m` (đơn vị) trong model_manifest_v1.schema.json.
  lstm_units: 32
  dropout: 0.2
  dense_units: 32
  dense_activation: relu
  batch_size: 32
  max_epochs: 100
  learning_rate: 0.001
  early_stopping_patience: 10
  loss: huber
  optimizer: adam
  metrics: [mae]
  callbacks:
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 10
      restore_best_weights: true
    reduce_lr:
      monitor: val_loss
      mode: min
      factor: 0.5
      patience: 5
      min_lr: 0.000001
    model_checkpoint:
      monitor: val_loss
      mode: min
      save_best_only: true
      # Placeholder artifact-relative: ghi cạnh manifest trong out_dir
      # (ai_model/artifacts/lstm-v1/model.keras theo PLAN mục 4).
      filepath: model.keras
