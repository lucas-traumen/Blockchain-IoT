# Synthetic benchmark only: generated 40 mm movement, not an ESP32 validation.
window_size: 10
delta_s: 0.1
horizons_ms:
- 100
- 200
- 300
- 400
- 500
max_time_jitter_s: 0.03
max_gap_s: 0.25
stale_after_s: 0.5
random_seed: 20261010
model_type: lstm
model_version: lstm-synthetic-square40-v1
preprocessing_version: pp-lstm-v1
lstm:
  model_type: lstm
  model_version: lstm-synthetic-square40-v1
  preprocessing_version: pp-lstm-v1
  window_size: 10
  delta_s: 0.1
  horizons_ms:
  - 100
  - 200
  - 300
  - 400
  - 500
  features:
  - distance_m
  - delta_distance_m
  input_shape:
  - 10
  - 2
  output_shape:
  - 5
  lstm_units: 32
  dropout: 0.2
  dense_units: 32
  dense_activation: relu
  batch_size: 32
  max_epochs: 100
  learning_rate: 0.001
  early_stopping_patience: 10
  loss: huber
  optimizer: adam
  metrics:
  - mae
  callbacks:
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 10
      restore_best_weights: true
    reduce_lr:
      monitor: val_loss
      mode: min
      factor: 0.5
      patience: 5
      min_lr: 1.0e-06
    model_checkpoint:
      monitor: val_loss
      mode: min
      save_best_only: true
      filepath: model.keras
