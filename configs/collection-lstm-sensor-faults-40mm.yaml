# Thu lỗi cảm biến riêng với Sp = 0.040 m.
# Các session sensor_check bị loại khỏi LSTM distance windows và dùng cho
# đánh giá UNKNOWN/ingestion riêng.
# Chạy bằng:
#   .venv/bin/python -m scripts.collect_dataset \
#     --plan configs/collection-lstm-sensor-faults-40mm.yaml \
#     --output-dir data/datasets/real-20261010/sensor-fault-01

defaults:
  target_type: none
  duration_s: 20

sessions:
  - scenario: sensor_check
    speed_level: no_target
    repetitions: 5
    zone_note: >-
      Sp=0.040 m. Ghi lỗi ECHO_TIMEOUT bằng thao tác kiểm thử có kiểm soát;
      giữ valid=false và error_code đúng từ firmware, không gán distance giả.

  - scenario: sensor_check
    speed_level: no_target
    repetitions: 5
    zone_note: >-
      Sp=0.040 m. Ghi lỗi ECHO_STUCK_LOW bằng thao tác kiểm thử có kiểm soát;
      giữ valid=false và error_code đúng từ firmware, không gán distance giả.

  - scenario: sensor_check
    speed_level: no_target
    repetitions: 5
    zone_note: >-
      Sp=0.040 m. Ghi lỗi ECHO_STUCK_HIGH bằng thao tác kiểm thử có kiểm soát;
      giữ valid=false và error_code đúng từ firmware, không gán distance giả.

  - scenario: sensor_check
    speed_level: no_target
    repetitions: 5
    zone_note: >-
      Sp=0.040 m. Ghi lỗi TRIG_FAIL bằng thao tác kiểm thử có kiểm soát;
      giữ valid=false và error_code đúng từ firmware, không gán distance giả.
