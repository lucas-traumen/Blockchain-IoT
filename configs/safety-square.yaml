# Cấu hình thuật toán ngưỡng safety (SSM một chiều, robot phanh đều).
# 'versions' là danh sách các phiên bản theo thời gian: khi đánh giá mẫu tại thời điểm t,
# iot_backend chọn phiên bản có valid_from <= t lớn nhất (mới nhất trong quá khứ).
# Thêm phiên bản mới bằng cách append phần tử vào 'versions' — không cần đổi code.
# Công thức: Sh = vh*(tr_s + ts_s); Sr = vr*tr_s; Ss = vr*ts_s/2; Sp = Sh+Sr+Ss+c_m+zd_m+zr_m.
versions:
  - config_version: demo-v1
    valid_from: "2026-01-01T00:00:00Z"
    params:
      vh: 1.0     # vận tốc người tiếp cận (m/s)
      vr: 0.2     # vận tốc robot (m/s)
      tr_s: 0.1   # thời gian phản ứng (s)
      ts_s: 0.2   # thời gian phanh (s)
      c_m: 0.05   # khoảng cách an toàn tối thiểu (m)
      zd_m: 0.03  # dự phòng sai số đo đạc (m)
      zr_m: 0.02  # dự phòng kích thước robot (m)
    measurement_zone_m:
      min: 0.10   # vùng đo đã kiểm chứng của HC-SR04 (m)
      max: 1.00

  # Ngưỡng hình học của mô hình một cạnh hình vuông; không phải SSM robot thật.
  # Hiệu lực cho số đo mới, giữ demo-v1 để replay dataset lịch sử.
  - config_version: square-boundary-v1
    valid_from: "2026-10-09T16:51:04Z"
    mode: fixed_boundary
    threshold_m: 0.040
    # Giữ vùng đo đã có. 40 mm nằm dưới min 100 mm: cảnh báo calibration
    # vẫn được xuất, không tự khai báo vùng gần đã được kiểm chứng.
    measurement_zone_m:
      min: 0.10
      max: 1.00
