# Thu dữ liệu chuyển động cho LSTM và event F1 với Sp = 0.040 m (40 mm).
# Mỗi repetition là một session độc lập; runner vẫn dừng trước START.
# Chạy bằng:
#   .venv/bin/python -m scripts.collect_dataset \
#     --plan configs/collection-lstm-f1-40mm.yaml \
#     --output-dir data/datasets/real-20261010/f1-movement-01

defaults:
  target_type: person
  duration_s: 35

sessions:
  # Positive event chính: current > 40 mm, tương lai trong 100–500 ms <= 40 mm.
  - scenario: approach
    speed_level: slow
    repetitions: 7
    zone_note: >-
      Sp=0.040 m (40 mm). Bắt đầu ở 160-180 mm; tiến đều qua 80 mm,
      60 mm, 50 mm và kết thúc ở 30-35 mm. Giữ đủ mẫu trước crossing;
      ghi mốc crossing độc lập bằng thước/video nếu có.

  - scenario: approach
    speed_level: medium
    repetitions: 7
    zone_note: >-
      Sp=0.040 m (40 mm). Bắt đầu ở 160-180 mm; tiến đều qua vùng
      60-80 mm rồi xuống 30-35 mm. Không nhảy đột ngột qua ngưỡng;
      ghi mốc crossing độc lập.

  - scenario: approach
    speed_level: fast
    repetitions: 6
    zone_note: >-
      Sp=0.040 m (40 mm). Bắt đầu ở 160-180 mm; tiến nhanh nhưng vẫn
      phải có vài mẫu hợp lệ trước crossing. Kết thúc ở 30-35 mm;
      thao tác trong vùng thử an toàn.

  # Negative gần ngưỡng: dùng tính false-warning/precision.
  - scenario: stop
    speed_level: medium
    repetitions: 10
    zone_note: >-
      Sp=0.040 m (40 mm). Bắt đầu ở 160-180 mm; tiến gần rồi dừng tại
      50-70 mm, giữ yên ít nhất 5 giây. Không được chạm hoặc xuống dưới 40 mm.

  - scenario: stationary
    speed_level: still
    repetitions: 5
    zone_note: >-
      Sp=0.040 m (40 mm). Giữ mục tiêu đứng yên ở 160-180 mm trong suốt
      session; không crossing ngưỡng.

  - scenario: stationary
    speed_level: near_threshold
    repetitions: 5
    zone_note: >-
      Sp=0.040 m (40 mm). Giữ mục tiêu đứng yên ở 45-60 mm, vẫn CLEAR.
      Ghi lại mọi lần nhiễu chạm <=40 mm trong manifest, không tự loại mẫu.

  # Positive/negative lặp: đánh giá episode và cảnh báo chattering.
  - scenario: oscillation
    speed_level: variable
    repetitions: 10
    zone_note: >-
      Sp=0.040 m (40 mm). Dao động có kiểm soát quanh 35-55 mm,
      tạo 3-5 lần crossing từ trên xuống độc lập trong mỗi session;
      giữ khoảng dừng ngắn giữa các lần crossing.

  # Chiều chuyển động ngược: không tạo cảnh báo approach giả.
  - scenario: recede
    speed_level: slow
    repetitions: 2
    zone_note: >-
      Sp=0.040 m (40 mm). Bắt đầu ở 30-35 mm rồi di chuyển ra xa đều
      qua 50-70 mm và kết thúc trên 100 mm; không tiến lại gần sau đó.

  - scenario: recede
    speed_level: medium
    repetitions: 2
    zone_note: >-
      Sp=0.040 m (40 mm). Bắt đầu ở 30-35 mm rồi di chuyển ra xa đều
      qua 50-70 mm và kết thúc trên 100 mm; không tiến lại gần sau đó.

  - scenario: recede
    speed_level: fast
    repetitions: 1
    zone_note: >-
      Sp=0.040 m (40 mm). Bắt đầu ở 30-35 mm rồi di chuyển ra xa nhanh
      nhưng có kiểm soát, kết thúc trên 100 mm.
