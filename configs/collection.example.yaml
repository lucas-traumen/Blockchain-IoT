# Kế hoạch thu dataset thật. Mỗi entry là một lượt độc lập.
# Chạy:
#   .venv/bin/python -m scripts.collect_dataset --plan configs/collection.example.yaml
# Script vẫn dừng trước START để người vận hành đặt mục tiêu.

defaults:
  target_type: person
  duration_s: 30

sessions:
  - scenario: stationary
    speed_level: still
    repetitions: 5
    zone_note: Giữ mục tiêu đứng yên; ghi khoảng cách thực tế trong sổ thu.

  - scenario: approach
    speed_level: slow
    repetitions: 5
    zone_note: Tiến gần đều từ xa tới gần; mục tiêu và quãng đường phải ghi rõ.

  - scenario: approach
    speed_level: medium
    repetitions: 5
    zone_note: Tiến gần ở tốc độ vừa, an toàn.

  - scenario: approach
    speed_level: fast
    repetitions: 5
    zone_note: Tiến gần nhanh nhưng an toàn.

  - scenario: recede
    speed_level: slow
    repetitions: 5
    zone_note: Rời xa đều từ gần tới xa.

  - scenario: recede
    speed_level: medium
    repetitions: 5
    zone_note: Rời xa ở tốc độ vừa.

  - scenario: recede
    speed_level: fast
    repetitions: 5
    zone_note: Rời xa nhanh nhưng an toàn.

  - scenario: stop
    speed_level: variable
    repetitions: 5
    zone_note: Tiến gần rồi dừng; giữ yên sau khi dừng.

  - scenario: reversal
    speed_level: variable
    repetitions: 5
    zone_note: Tiến gần rồi đổi hướng rời xa trong cùng session.

  - scenario: oscillation
    speed_level: variable
    repetitions: 5
    zone_note: Dao động quanh vùng ngưỡng demo; ghi khoảng cách thực tế.

  - scenario: stationary
    speed_level: near_threshold
    repetitions: 5
    zone_note: Giữ mục tiêu quanh ngưỡng demo 440 mm; đây chưa phải ngưỡng hiệu chuẩn.

  - scenario: sensor_check
    speed_level: no_target
    repetitions: 5
    target_type: none
    zone_note: Ghi nhận điều kiện không có mục tiêu hoặc timeout nếu tự nhiên xảy ra.
