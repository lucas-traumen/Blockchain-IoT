name: blockchain-hrc

services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    user: "1883:1883"
    restart: unless-stopped
    ports:
      - "${HRC_MQTT_BIND:-0.0.0.0}:${HRC_MQTT_HOST_PORT:-1885}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: blockchain-hrc:${HRC_RUNTIME_TARGET:-backend}
    build:
      context: .
      target: ${HRC_RUNTIME_TARGET:-backend}
    restart: unless-stopped
    init: true
    depends_on:
      mqtt:
        condition: service_healthy
    ports:
      - "${HRC_API_BIND:-0.0.0.0}:${HRC_API_HOST_PORT:-8001}:8000"
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      HRC_MQTT_ENABLED: "true"
      HRC_DB_PATH: /app/data/hrc.db
      DEVICE_ID: ${HRC_DEVICE_ID:-esp32_01}
      HRC_ACK_TIMEOUT_S: ${HRC_ACK_TIMEOUT_S:-2.0}
      SAFETY_CONFIG: /app/configs/safety.yaml
      MODEL_CONFIG: /app/configs/model.yaml
      MODEL_TYPE: ${HRC_MODEL_TYPE:-rf}
      MODEL_ARTIFACT_DIR: /app/ai_model/artifacts/${HRC_MODEL_SUBDIR:-}
      KERAS_HOME: /tmp/keras
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTEROP_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - backend_data:/app/data
      - ./ai_model/artifacts:/app/ai_model/artifacts:ro
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional tools for train/evaluate/export; no second running API/DB writer.
  ai:
    profiles: ["ai"]
    image: blockchain-hrc:ai
    build:
      context: .
      target: ai
    init: true
    user: "${HRC_AI_UID:-1000}:${HRC_AI_GID:-1000}"
    environment:
      KERAS_HOME: /tmp/keras
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTEROP_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - ./data:/app/data
      - ./ai_model/artifacts:/app/ai_model/artifacts
      - ./configs:/app/configs:ro
    command: ["python", "-m", "ai_model.evaluate", "--help"]

volumes:
  mqtt_data:
  backend_data:
